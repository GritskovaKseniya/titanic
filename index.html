<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Титаник: Корабль легенд</title>
    <meta name="description" content="Документальный сериал о «Титанике»: архивная хроника и ИИ-реконструкции утраченных сцен. 1 сезон, 10 серий." />

    <!-- "Add to Home Screen": a manifest + icons so the site installs like an
         app, with its own icon and no browser chrome. theme-color matches the
         default (blue) palette — the data-theme switcher only swaps in-page
         colors, not this static manifest. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0EA5E9" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Титаник" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Type: condensed display + humanist body + timecode mono — same trio as onetwofilm-learning-center, all three carry Cyrillic.
         Playfair Display is loaded too, for the "classic serif" palette-switcher option (swaps the heading font via --font-heading). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>
  <body class="bg-dark text-bone antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
