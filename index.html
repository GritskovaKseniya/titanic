<!DOCTYPE html>
<html lang="ru" data-theme="gold">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon-gold.svg" />
    <title>Титаник: Корабль легенд</title>
    <meta name="description" content="Документальный сериал о «Титанике»: архивная хроника и ИИ-реконструкции утраченных сцен. 1 сезон, 10 серий." />

    <!-- "Add to Home Screen": a manifest + icons so the site installs like an
         app, with its own icon and no browser chrome. These tags are the
         static fallback for the site's theme (gold, also set on <html> above
         so the page doesn't flash another palette before the script runs) and
         the default language ('en') — ThemeSwitcher swaps the manifest/title
         to the current language as soon as it mounts (see public/manifests/). -->
    <link rel="manifest" href="/manifests/gold-en.webmanifest" />
    <meta name="theme-color" content="#C2A064" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-gold.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Titanic" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Type: condensed display + humanist body + timecode mono — same trio as onetwofilm-learning-center, all three carry Cyrillic.
         Playfair Display is loaded too, for the "classic serif" palette-switcher option (swaps the heading font via --font-heading). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

  </head>
  <body class="bg-dark text-bone antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
